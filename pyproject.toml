[project]
name = "dg"
version = "0.1.0"
description = "Reproducible analyses of reward-dependent visual-behavior gating"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lazynwb @ git+https://github.com/bjhardcastle/lazynwb.git@387c250bee6a6fddd5c96b9cf1490b8f02c292f8",
    "numpy>=2.0",
    "polars>=1.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: read-only integration test against published remote data",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
